name: Build BulletOu state importer

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/nn_to_bulletou_state.cpp"
      - ".github/workflows/build-state-importer.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Build x64 importer
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          g++ -O2 -std=c++17 -static -s tools/nn_to_bulletou_state.cpp -o nn_to_bulletou_state.exe
          test -f nn_to_bulletou_state.exe

      - name: Upload importer
        uses: actions/upload-artifact@v4
        with:
          name: nn_to_bulletou_state-win64
          path: nn_to_bulletou_state.exe
          if-no-files-found: error
