name: Build Tuyoura72 Converter Tools Windows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-tuyoura72-converters.yml"
      - "tools/nn_to_bulletou_state_h1_8_72.cpp"
      - "tools/bulletou_state_to_nn_h1_8_72.cpp"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            make
      - name: Compile Windows x64 H1=8 72 converters
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          clang++ -O2 -std=c++17 -static -static-libgcc -static-libstdc++ tools/nn_to_bulletou_state_h1_8_72.cpp -o nn_to_bulletou_state_h1_8_72.exe
          clang++ -O2 -std=c++17 -static -static-libgcc -static-libstdc++ tools/bulletou_state_to_nn_h1_8_72.cpp -o bulletou_state_to_nn_h1_8_72.exe
          test -s nn_to_bulletou_state_h1_8_72.exe
          test -s bulletou_state_to_nn_h1_8_72.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Tuyoura72_H1_8_ConverterTools_win64
          path: |
            nn_to_bulletou_state_h1_8_72.exe
            bulletou_state_to_nn_h1_8_72.exe
          if-no-files-found: error
