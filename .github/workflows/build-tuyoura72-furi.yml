name: Build Tuyoura72 Furi Windows AVX2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-tuyoura72-furi.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout YaneuraOu pinned source
        shell: bash
        run: |
          git clone https://github.com/yaneurao/YaneuraOu.git upstream
          git -C upstream checkout c1b80eaa09fe13d5f12b1599d1ae4d53c224de30

      - name: Apply verified Furi modifications
        shell: bash
        run: |
          tr -d '\r\n' < tools/yaneuraou-v990-furi-patch.gz.b64 | base64 -d | gzip -d > furi.patch
          git -C upstream apply --check ../furi.patch
          git -C upstream apply ../furi.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('upstream/source/engine/yaneuraou-engine/yaneuraou-search.cpp')
          s=p.read_text(encoding='utf-8-sig')
          assert 'options.add("FuriBisha", Option(true,' in s
          p.write_text(s.replace('options.add("FuriBisha", Option(true,', 'options.add("FuriBisha", Option(false,'),encoding='utf-8-sig')
          print('FuriBisha default OFF, modification retained')
          PY

      - name: Install MSYS2 clang64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            make
            python
            mingw-w64-clang-x86_64-clang

      - name: Build H1=8 k3k3 progress8 Furi AVX2
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd upstream/source
          make clean YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_halfka2_1024_8_64_k3k3_progress8
          make -j2 normal \
            COMPILER=clang++ \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_halfka2_1024_8_64_k3k3_progress8 \
            ENGINE_NAME=TuyouraOu11_H1_8_k3k3_progress8_Furi \
            TARGET_CPU=AVX2
          test -s YaneuraOu-by-gcc.exe
          cp YaneuraOu-by-gcc.exe ../../TuyouraOu11_72stack_Furi_V990DEV_AVX2.exe

      - name: USI smoke test and Furi option check
        shell: pwsh
        run: |
          "usi`nquit`n" | .\TuyouraOu11_72stack_Furi_V990DEV_AVX2.exe | Tee-Object -FilePath usi-smoke.txt
          if (-not (Select-String -Path usi-smoke.txt -Pattern "usiok" -Quiet)) { throw "USI handshake failed" }
          if (-not (Select-String -Path usi-smoke.txt -Pattern "FuriBisha" -Quiet)) { throw "FuriBisha option missing" }
          if (-not (Select-String -Path usi-smoke.txt -Pattern "FV_SCALE" -Quiet)) { throw "FV_SCALE option missing" }

      - name: Save verified Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TuyouraOu11_72stack_Furi_V990DEV_AVX2
          path: |
            TuyouraOu11_72stack_Furi_V990DEV_AVX2.exe
            usi-smoke.txt
          if-no-files-found: error
