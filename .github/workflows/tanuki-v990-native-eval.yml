name: Tanuki WCSC36 on V990 search (native SFNN adapter)
on:
  workflow_dispatch:
  push:
    branches: [experiment/tanuki-wcsc36-v990-search]
    paths: [.github/workflows/tanuki-v990-native-eval.yml]

jobs:
  build:
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned source of search and evaluation
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/yaneurao/YaneuraOu.git upstream
          git -C upstream checkout c1b80eaa09fe13d5f12b1599d1ae4d53c224de30
          git clone https://github.com/nodchip/tanuki-.git tanuki
          git -C tanuki checkout abccc2ba0fe1cc34e354399f275d27f732dc96e7
          cp tanuki/source/progress.bin progress.bin
          sha256sum progress.bin > progress_sha256.txt

      - name: Match WCSC36's HalfKA_hm fingerprint without altering features
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          file = Path('upstream/source/eval/nnue/features/half_ka_hm2.h')
          value = file.read_text(encoding='utf-8-sig')
          assert value.count('0x7f234cb9u') == 1
          file.write_text(value.replace('0x7f234cb9u', '0x5f134cb9u'), encoding='utf-8-sig')
          # HalfKA_hm2 is algorithmically identical to tanuki HalfKA_hm.
          # No search code, NNUE weights, or layer operations are modified here.
          PY

      - name: Install Windows CLANG64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            make
            python
            mingw-w64-clang-x86_64-clang

      - name: Compile YaneuraOu V990 search with tanuki 8-stack architecture
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd upstream/source
          make clean COMPILER=clang++ YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_halfkahm2_1536_15_32_progress8
          make -j4 normal \
            COMPILER=clang++ \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_halfkahm2_1536_15_32_progress8 \
            ENGINE_NAME=Tanuki_WCSC36_YaneuraOu_V990_search \
            TARGET_CPU=AVX2 \
            EXTRA_CPPFLAGS='-include iterator'
          test -s YaneuraOu-by-gcc.exe
          cp YaneuraOu-by-gcc.exe ../../tanuki_wcsc36_v990_search_AVX2.exe
          sha256sum YaneuraOu-by-gcc.exe > ../../executable_sha256.txt

      - name: Confirm 8-stack architecture and USI options
        shell: pwsh
        run: |
          $generated = Get-Content 'upstream/source/eval/nnue/architectures/SFNN_halfkahm2_1536_15_32_progress8.h' -Raw
          if ($generated -notmatch 'LayerStacks = 8') { throw "wrong layer stack count" }
          if ($generated -notmatch 'kHidden1Dims = 15') { throw "wrong H1" }
          if ($generated -notmatch 'kHidden2Dims = 32') { throw "wrong H2" }
          "usi`nquit`n" | .\tanuki_wcsc36_v990_search_AVX2.exe | Tee-Object -FilePath usi-smoke.txt
          if (-not (Select-String -Path usi-smoke.txt -Pattern 'usiok' -Quiet)) { throw 'USI failed' }
          if (-not (Select-String -Path usi-smoke.txt -Pattern 'FV_SCALE' -Quiet)) { throw 'FV_SCALE missing' }
          Get-FileHash tanuki_wcsc36_v990_search_AVX2.exe -Algorithm SHA256 | Format-List | Out-String | Set-Content windows_sha256.txt

      - name: Package search-only comparison engine (weights remain separate)
        uses: actions/upload-artifact@v4
        with:
          name: Tanuki_WCSC36_Search_V990_AVX2
          path: |
            tanuki_wcsc36_v990_search_AVX2.exe
            progress.bin
            usi-smoke.txt
            executable_sha256.txt
            progress_sha256.txt
            windows_sha256.txt
          if-no-files-found: error
