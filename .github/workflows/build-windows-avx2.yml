name: Build Windows AVX2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows-avx2.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout YaneuraOu
        shell: bash
        run: |
          git clone https://github.com/yaneurao/YaneuraOu.git upstream
          cd upstream
          git checkout c1b80eaa09fe13d5f12b1599d1ae4d53c224de30

      - name: Enable STATIC_EVAL diagnostic output
        shell: bash
        run: |
          sed -i 's|// TODO あとで|sync_cout << "STATIC_EVAL " << Eval::evaluate(p) << sync_endl;|' upstream/source/engine/yaneuraou-engine/yaneuraou-search.cpp
          grep -n "STATIC_EVAL" upstream/source/engine/yaneuraou-engine/yaneuraou-search.cpp

      - name: Install MSYS2 clang64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            make
            python
            mingw-w64-clang-x86_64-clang

      - name: Build k3k3+progress8 AVX2 engine
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd upstream/source
          make clean YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_halfka2_1024_7_64_k3k3_progress8
          make -j2 tournament \
            COMPILER=clang++ \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_halfka2_1024_7_64_k3k3_progress8 \
            ENGINE_NAME=YaneuraOu_Suisho11Plus_k3k3_progress8 \
            TARGET_CPU=AVX2
          test -f YaneuraOu-by-gcc.exe
          cp YaneuraOu-by-gcc.exe ../../YaneuraOu_Suisho11Plus_k3k3_progress8-V990DEV_AVX2.exe

      - name: Build original k3k3 AVX2 engine
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd upstream/source
          make clean YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_halfka2_1024_7_64_k3k3
          make -j2 tournament \
            COMPILER=clang++ \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_halfka2_1024_7_64_k3k3 \
            ENGINE_NAME=YaneuraOu_Suisho11Plus_k3k3 \
            TARGET_CPU=AVX2
          test -f YaneuraOu-by-gcc.exe
          cp YaneuraOu-by-gcc.exe ../../YaneuraOu_Suisho11Plus_k3k3-V990DEV_AVX2.exe

      - name: Smoke test both USI engines
        shell: pwsh
        run: |
          "usi`nquit`n" | .\YaneuraOu_Suisho11Plus_k3k3_progress8-V990DEV_AVX2.exe | Tee-Object -FilePath usi-smoke-progress8.txt
          if (-not (Select-String -Path usi-smoke-progress8.txt -Pattern "usiok" -Quiet)) {
            throw "progress8 USI smoke test failed."
          }
          "usi`nquit`n" | .\YaneuraOu_Suisho11Plus_k3k3-V990DEV_AVX2.exe | Tee-Object -FilePath usi-smoke-k3k3.txt
          if (-not (Select-String -Path usi-smoke-k3k3.txt -Pattern "usiok" -Quiet)) {
            throw "k3k3 USI smoke test failed."
          }

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: YaneuraOu_Suisho11Plus_AB-V990DEV_AVX2
          path: |
            YaneuraOu_Suisho11Plus_k3k3_progress8-V990DEV_AVX2.exe
            YaneuraOu_Suisho11Plus_k3k3-V990DEV_AVX2.exe
            usi-smoke-progress8.txt
            usi-smoke-k3k3.txt
          if-no-files-found: error
