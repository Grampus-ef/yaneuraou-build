          git -C BulletOu diff --stat

      - name: Normalize negative float in Clap regression test
        shell: pwsh
        run: |
          $path = "BulletOu\examples\bulletou.rs"
          $source = [System.IO.File]::ReadAllText($path)
          $old = '&["--sfnn-ft-lr-mult", "-0.1"]'
          $new = '&["--sfnn-ft-lr-mult=-0.1"]'
          $matches = ([regex]::Matches($source, [regex]::Escape($old))).Count
          if ($matches -ne 1) { throw "Expected one negative FT multiplier test argument, found $matches" }
          [System.IO.File]::WriteAllText($path, $source.Replace($old, $new), [System.Text.UTF8Encoding]::new($false))
          git -C BulletOu diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }

      - name: Replace cc-rs CUDA build with direct nvcc for Windows
        shell: pwsh
        run: |
          @'
          use std::{env, path::PathBuf, process::Command};

          fn cuda_path() -> PathBuf {
              for name in ["CUDA_PATH", "CUDA_PATH_V13_2", "CUDA_PATH_V13_1", "CUDA_PATH_V13_0", "CUDA_PATH_V12_9", "CUDA_PATH_V12_8"] {
                  if let Ok(value) = env::var(name) {
                      let p = PathBuf::from(value);
                      if p.exists() { return p; }
                  }
              }
              panic!("CUDA_PATH not found");
          }

          fn run(cmd: &mut Command) {
              println!("running: {:?}", cmd);
              let status = cmd.status().expect("failed to spawn command");
              if !status.success() { panic!("command failed: {:?}", cmd); }
          }

          fn main() {
              let cuda = cuda_path();
              let include = cuda.join("include");
              let lib_dir = cuda.join("lib").join("x64");
              let out = PathBuf::from(env::var("OUT_DIR").unwrap());
              let obj = out.join("bulletou_cuda_backend.obj");
              let lib = out.join("bulletou_cuda_cpp_backend.lib");

              println!("cargo:rerun-if-changed=cpp/bulletou_cuda_backend.cu");
              println!("cargo:rerun-if-changed=cpp/batch_norm.cuh");
              println!("cargo:rerun-if-changed=cpp/bn_qat.cuh");

              run(Command::new("nvcc")
                  .arg("-ccbin=cl.exe")
                  .arg("-I").arg(&include)
                  .arg("-std=c++17")
                  .arg("-O3")
                  .arg("--use_fast_math")
                  .arg("--allow-unsupported-compiler")
                  .arg("-gencode").arg("arch=compute_75,code=sm_75")
                  .arg("-gencode").arg("arch=compute_75,code=compute_75")
                  .arg("-Xcompiler").arg("/MD")
                  .arg("-Xcompiler").arg("/O2")
                  .arg("-c")
                  .arg("cpp/bulletou_cuda_backend.cu")
                  .arg("-o").arg(&obj));

              run(Command::new("lib.exe")
                  .arg("/NOLOGO")
                  .arg(format!("/OUT:{}", lib.display()))
                  .arg(&obj));

              println!("cargo:rustc-link-search=native={}", out.display());
              println!("cargo:rustc-link-lib=static=bulletou_cuda_cpp_backend");
              println!("cargo:rustc-link-search=native={}", lib_dir.display());
              println!("cargo:rustc-link-lib=dylib=cudart");
              println!("cargo:rustc-link-lib=dylib=cublas");
          }
          '@ | Set-Content -Path "BulletOu\crates\cuda_cpp\build.rs" -Encoding utf8

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA Toolkit 12.8.1
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: local

      - name: Show toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          nvcc --version
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

      - name: Test FT-freeze CLI behavior (CPU-safe)
        shell: pwsh
        working-directory: BulletOu
        run: |
          cargo test -p bulletou_lib --features cuda-cpp-backend --example bulletou sfnn_ft_lr_mult_zero_freezes_ft_only -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "FT-freeze CLI regression failed" }

      - name: Compile CUDA dirty-bucket regression test (no GPU on hosted runner)
        shell: pwsh
        working-directory: BulletOu
        run: |
          cargo test -p bulletou-cuda-cpp --lib frozen_stacked_group_is_untouched_on_dirty_bucket_path --no-run
          if ($LASTEXITCODE -ne 0) { throw "CUDA regression test compile failed" }

      - name: Build BulletOu
        shell: pwsh
        working-directory: BulletOu
        run: |
          cargo build --release --features cuda-cpp-backend --example bulletou
          if ($LASTEXITCODE -ne 0) { throw "BulletOu release build failed" }
          if (-not (Test-Path .\target\release\examples\bulletou.exe)) { throw "bulletou.exe missing" }

      - name: Collect runtime and provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item BulletOu\target\release\examples\bulletou.exe dist\bulletou.exe
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          foreach ($dll in @("cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll", "nvJitLink_120_0.dll")) {
            $src = Join-Path $cudaBin $dll
            if (Test-Path $src) { Copy-Item $src (Join-Path "dist" $dll) }
          }
          .\dist\bulletou.exe --help 2>&1 | Out-File -Encoding utf8 dist\bulletou-help.txt
          if ($LASTEXITCODE -ne 0) { throw "bulletou --help failed" }
          dumpbin /dependents .\dist\bulletou.exe | Out-File -Encoding utf8 dist\bulletou-deps.txt
          Get-FileHash .\dist\bulletou.exe -Algorithm SHA256 | Format-List | Out-File -Encoding ascii dist\SHA256.txt
          @'
          Upstream: yaneurao/BulletOu
          Commit: 29af3d083dc42fc9d89047be4071f37a58579ca7
          Patch: SFNN FT-freeze + dirty-bucket frozen stack regression
          Patch SHA256: 5c194d2d77b604fcd6c768423d0f68209e12d12351efe66bf4d61fe8eded0f0a
          Build: windows-2022 / CUDA 12.8.1 / sm_75
          Validation: CLI regression run; CUDA test compiled but not executed (hosted runner has no NVIDIA GPU)
          '@ | Set-Content -Path dist\build-provenance.txt -Encoding utf8

      - name: Pack CUDA runtime split (retain legacy artifact layout)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core | Out-Null
          foreach ($name in @("bulletou.exe", "cudart64_12.dll", "cublas64_12.dll", "nvJitLink_120_0.dll", "bulletou-help.txt", "bulletou-deps.txt", "SHA256.txt", "build-provenance.txt")) {
            $src = Join-Path "dist" $name
            if (Test-Path $src) { Copy-Item $src (Join-Path "core" $name) }
          }
          Compress-Archive -Path core\* -DestinationPath BulletOu-FTfreeze-core.zip -CompressionLevel Optimal
          if (-not (Test-Path dist\cublasLt64_12.dll)) { throw "cublasLt64_12.dll missing" }
          Compress-Archive -Path dist\cublasLt64_12.dll -DestinationPath BulletOu-FTfreeze-cublasLt.zip -CompressionLevel Optimal

      - name: Upload BulletOu FT-freeze core
        uses: actions/upload-artifact@v4
        with:
          name: BulletOu-FTfreeze-29af3d0-win64-core
          path: BulletOu-FTfreeze-core.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload cuBLASLt runtime
        uses: actions/upload-artifact@v4
        with:
          name: BulletOu-FTfreeze-29af3d0-cublasLt
          path: BulletOu-FTfreeze-cublasLt.zip
          if-no-files-found: error
          compression-level: 0
