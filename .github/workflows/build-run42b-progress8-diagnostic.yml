name: Build RUN42B progress8 diagnostic Windows AVX2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-run42b-progress8-diagnostic.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout YaneuraOu pinned source
        shell: bash
        run: |
          git clone https://github.com/yaneurao/YaneuraOu.git upstream
          git -C upstream checkout c1b80eaa09fe13d5f12b1599d1ae4d53c224de30

      - name: Apply verified Furi modifications
        shell: bash
        run: |
          tr -d '\r\n' < tools/yaneuraou-v990-furi-patch.gz.b64 | base64 -d | gzip -d > furi.patch
          git -C upstream apply --check ../furi.patch
          git -C upstream apply ../furi.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('upstream/source/engine/yaneuraou-engine/yaneuraou-search.cpp')
          s=p.read_text(encoding='utf-8-sig')
          assert 'options.add("FuriBisha", Option(true,' in s
          p.write_text(s.replace('options.add("FuriBisha", Option(true,', 'options.add("FuriBisha", Option(false,'),encoding='utf-8-sig')
          print('FuriBisha default OFF, modification retained')
          PY

      - name: Insert RUN42B runtime progress8 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('upstream/source/usi.cpp')
          s = p.read_text(encoding='utf-8-sig')
          assert 'run42b_bucket' not in s, 'Diagnostic already present'
          include_anchor = '#include "movegen.h"'
          assert s.count(include_anchor) == 1, 'USI include anchor missing'
          s = s.replace(include_anchor, include_anchor + '\n\n// RUN42B observation-only progress8 diagnostic\n#if defined(EVAL_NNUE) && defined(SFNNwoPSQT)\n#include "eval/nnue/evaluate_nnue.h"\n#endif', 1)
          e_anchor = 'sync_cout << "eval = " << engine.evaluate() << sync_endl;'
          assert s.count(e_anchor) == 1, 'USI e-command anchor missing'
          diag = '''

          // RUN42B: report exact runtime progress8 network selection (no search).
          else if (token == "run42b_bucket") {
          #if defined(EVAL_NNUE) && defined(SFNNwoPSQT) && NNUE_SFNN_PROGRESS_BUCKETS == 8
              const auto& p = engine.get_position();
              const auto& params = Eval::NNUE::networks().progress;
              const auto sum = params.SumQ16(p);
              const auto idx = params.BucketIndex(p, 8);
              sync_cout << "info string run42b status=ok bucket=" << idx
                        << " sum_q16=" << sum
                        << " stacks=" << Eval::NNUE::kLayerStacks << sync_endl;
          #else
              sync_cout << "info string run42b status=unsupported" << sync_endl;
          #endif
          }
          '''
          s = s.replace(e_anchor, e_anchor + diag, 1)
          assert s.count('else if (token == "run42b_bucket")') == 1
          p.write_text(s, encoding='utf-8-sig')
          print('RUN42B direct progress diagnostic inserted')
          PY

      - name: Install MSYS2 clang64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            make
            python
            mingw-w64-clang-x86_64-clang

      - name: Build H1=8 RUN42B direct bucket diagnostic AVX2
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd upstream/source
          make clean YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_halfka2_1024_8_64_progress8
          make -j2 normal \
            COMPILER=clang++ \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_halfka2_1024_8_64_progress8 \
            ENGINE_NAME=TuyouraOu11_RUN42B_DIAG_8NET_AVX2 \
            TARGET_CPU=AVX2
          test -s YaneuraOu-by-gcc.exe
          cp YaneuraOu-by-gcc.exe ../../TuyouraOu11_RUN42B_DIAG_8NET_AVX2.exe

      - name: USI smoke test and Furi option check
        shell: pwsh
        run: |
          "usi`nquit`n" | .\TuyouraOu11_RUN42B_DIAG_8NET_AVX2.exe | Tee-Object -FilePath usi-smoke.txt
          if (-not (Select-String -Path usi-smoke.txt -Pattern "usiok" -Quiet)) { throw "USI handshake failed" }
          if (-not (Select-String -Path usi-smoke.txt -Pattern "FuriBisha" -Quiet)) { throw "FuriBisha option missing" }
          if (-not (Select-String -Path usi-smoke.txt -Pattern "FV_SCALE" -Quiet)) { throw "FV_SCALE option missing" }

      - name: Save verified Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TuyouraOu11_RUN42B_DIAG_8NET_AVX2
          path: |
            TuyouraOu11_RUN42B_DIAG_8NET_AVX2.exe
            usi-smoke.txt
          if-no-files-found: error
