name: Validate BulletOu V025 PowerShell 5.1 Syntax
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-bulletou-v025-ps5-syntax.yml'
permissions:
  contents: read
jobs:
  grammar:
    runs-on: windows-2022
    steps:
      - name: Windows PowerShell 5.1 full-script AST grammar check, no script execution
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $b64=@'
          
          '@
          $compressed=[Convert]::FromBase64String(($b64 -replace '\s',''))
          $inputBytes=[IO.MemoryStream]::new($compressed)
          $gunzip=[IO.Compression.GzipStream]::new($inputBytes,[IO.Compression.CompressionMode]::Decompress)
          $outputBytes=[IO.MemoryStream]::new()
          $gunzip.CopyTo($outputBytes)
          $scriptPath=Join-Path $env:TEMP 'PROBE_500M_SM75_BCE_AB_V025.ps1'
          # Recreate the exact v0.2.5 patch from the previously AST-verified V024 bytes, then enforce SHA256.
          $raw=$outputBytes.ToArray()
          if($raw[0] -ne 239 -or $raw[1] -ne 187 -or $raw[2] -ne 191) {throw 'V024_SCRIPT_BOM_MISSING'}
          $s=[Text.Encoding]::UTF8.GetString($raw,3,$raw.Length-3)
          $s=$s.Replace('V024','V025').Replace('v0.2.4','v0.2.5')
          $needle="\u0024gpuArgs=@('--backend','cuda-cpp','--cuda-cpp-smoke')"
          $newLines=@(
            '# The CLI requires --teacher even for --cuda-cpp-smoke. Use existing PSV teacher path,'
            '# which is passed as an argument only; no training should take place in this smoke mode.'
            'RequireFile $teacher'
            "$\u0067puArgs=@('--backend','cuda-cpp','--teacher',$teacher,'--cuda-cpp-smoke')"
          )
          $replacement=($newLines -join [char]10)
          if(-not $s.Contains($needle)) {throw 'V024_GPU_SMOKE_ANCHOR_MISSING'}
          $s=$s.Replace($needle,$replacement)
          $s=$s.Replace('foreach($f in @($state,$progress,$nn,$dpos,$manifest)){','foreach($f in @($state,$progress,$nn,$dpos,$manifest,$teacher)){')
          $s=$s.Replace("  'NO FULL TRAINING: GPU smoke or exactly 1 batch of 64 training positions',",("  'NO FULL TRAINING: GPU smoke or exactly 1 batch of 64 training positions'," + [char]10 + "  'CUDA_SMOKE_TEACHER_ARGUMENT=J:\HAO\hao_depth_9_shuffled_01.bin',"))
          $utf8=[Text.UTF8Encoding]::new($false)
          $newBytes=$utf8.GetBytes($s)
          $payload=[byte[]](@(239,187,191)+$newBytes)
          [IO.File]::WriteAllBytes($scriptPath,$payload)
          $actual=(Get-FileHash -LiteralPath $scriptPath -Algorithm SHA256).Hash
          if($actual -ne 'C4711DF59AB312ACA497D48A3DA4C2CB554D60CF02708C19EBC3A9F598D86ADA'){throw "SCRIPT_HASH_MISMATCH: $actual"}
          $tokens=$null
          $parseErrors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($scriptPath,[ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count -gt 0){
            foreach($e in $parseErrors){Write-Error "$($e.Extent.StartLineNumber): $($e.Message)"}
            throw 'POWERSHELL_GRAMMAR_FAIL'
          }
          if($null -eq $ast){throw 'AST_MISSING'}
          Write-Host 'POWERSHELL_5_1_FULL_SCRIPT_PARSE_PASS'
          Write-Host "SHA256=$actual"
          if(-not ([IO.File]::ReadAllText($scriptPath).Contains("--teacher',$teacher,'--cuda-cpp-smoke"))) { throw 'TEACHER_ARG_MISSING' }
          Write-Host 'CUDA_SMOKE_TEACHER_ARG_VERIFIED'
