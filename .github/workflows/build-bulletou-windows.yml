name: Build BulletOu Windows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-bulletou-windows.yml"

jobs:
  build:
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Checkout BulletOu
        shell: bash
        run: |
          git clone --branch shogi-support https://github.com/yaneurao/BulletOu.git BulletOu
          cd BulletOu
          git checkout 169661c1833f3b1705f30d4e252ceaf2b6e892cb

      - name: Allow current MSVC host compiler
        shell: pwsh
        run: |
          $p = "BulletOu\crates\cuda_cpp\build.rs"
          $src = Get-Content $p -Raw
          $needle = '    build.flag("--use_fast_math");'
          $replacement = '    build.flag("--use_fast_math");' + [Environment]::NewLine + '    build.flag("--allow-unsupported-compiler");' + [Environment]::NewLine + '    build.flag("-arch=sm_75");'
          if (-not $src.Contains($needle)) { throw "build.rs patch target not found" }
          Set-Content -Path $p -Value ($src.Replace($needle, $replacement)) -Encoding utf8

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA Toolkit 13.2
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: "13.2.0"
          method: network
          sub-packages: '["nvcc","cudart","cublas","visual_studio_integration"]'

      - name: Show toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          nvcc --version
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

      - name: Build BulletOu
        shell: pwsh
        working-directory: BulletOu
        env:
          CC_ENABLE_DEBUG_OUTPUT: "1"
        run: |
          cargo build --release --features cuda-cpp-backend --example bulletou
          if (-not (Test-Path .\target\release\examples\bulletou.exe)) { throw "bulletou.exe not found" }

      - name: Collect runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item BulletOu\target\release\examples\bulletou.exe dist\bulletou.exe
          Get-ChildItem (Join-Path $env:CUDA_PATH "bin") -Filter "cudart64*.dll" | Copy-Item -Destination dist
          Get-ChildItem (Join-Path $env:CUDA_PATH "bin") -Filter "cublas64*.dll" | Copy-Item -Destination dist
          Get-ChildItem (Join-Path $env:CUDA_PATH "bin") -Filter "cublasLt64*.dll" | Copy-Item -Destination dist
          Get-ChildItem dist

      - name: Upload BulletOu
        uses: actions/upload-artifact@v4
        with:
          name: BulletOu-win64-cuda132
          path: dist/*
          if-no-files-found: error
